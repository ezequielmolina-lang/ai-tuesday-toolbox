<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Five Mornings</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* A pocket magazine, same family as EvidencIA Papers: the question opens on a full-bleed block in the course's color, then short white pages in heavy black type. One idea per screen. */
:root { --paper:#fff; --ink:#0d0d12; --ink-2:#4a4a55; --rule:#e6e6ec; --wash:#f4f4f7; --tema:#2f4bff; --tema-tinta:#fff; --tema-suave:#dfe4ff;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace; color-scheme:light; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { background:#e9e9ee; color:var(--ink); font-family:var(--f-body); margin:0; -webkit-tap-highlight-color:transparent; }
.escena { height:100%; display:grid; place-items:center; }
.reel { grid-template-columns:minmax(0, 1fr); position:relative; width:min(100vw, calc(100dvh * 9 / 16)); height:100%; max-height:100dvh; background:var(--paper); overflow:hidden; display:grid; grid-template-rows:auto 1fr auto; box-shadow:0 10px 50px rgba(13,13,18,.18); transition:background .35s; }
.reel.portada { background:var(--tema); color:var(--tema-tinta); }
.arriba { padding:14px 18px 0; display:grid; gap:10px; z-index:2; }
.avance { height:4px; border-radius:2px; background:color-mix(in srgb, currentColor 18%, transparent); overflow:hidden; }
.avance i { display:block; height:100%; background:currentColor; border-radius:2px; transition:width .4s; }
.meta { display:flex; justify-content:space-between; align-items:center; gap:8px; min-width:0; }
.marca { font-family:var(--f-display); font-weight:800; font-size:1.05rem; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.num { font-family:var(--f-mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
.lamina { position:relative; z-index:1; min-width:0; padding:18px 24px; display:grid; align-content:center; gap:16px; min-height:0; overflow-y:auto; animation:entra .4s cubic-bezier(.2,.8,.2,1) both; }
.lamina.arriba-alineada { align-content:start; }
@keyframes entra { from { opacity:0; transform:translateX(14px);} to { opacity:1; transform:none;} }
.tema { justify-self:start; font-family:var(--f-mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; border:1.5px solid currentColor; padding:4px 10px; border-radius:999px; }
.pregunta { font-family:var(--f-display); font-weight:800; font-size:clamp(1.7rem, 7.4vw, 2.5rem); line-height:1.02; letter-spacing:-.02em; margin:0; text-wrap:balance; }
.opciones { display:grid; gap:8px; }
.opcion { font:inherit; font-weight:700; font-size:1rem; text-align:left; color:inherit; background:transparent; border:1.5px solid currentColor; border-radius:12px; padding:12px 14px; cursor:pointer; line-height:1.3; }
.opcion.bien { background:var(--tema-tinta); color:var(--tema); border-color:var(--tema-tinta); }
.opcion.mal { opacity:.45; text-decoration:line-through; }
.opcion:disabled { cursor:default; }
.pista { font-family:var(--f-mono); font-size:.76rem; letter-spacing:.06em; text-transform:uppercase; opacity:.85; }
.etiqueta { font-family:var(--f-mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--tema); margin:0; }
.respuesta { font-family:var(--f-display); font-weight:700; font-size:clamp(1.5rem, 6.4vw, 2.1rem); line-height:1.08; letter-spacing:-.015em; margin:0; text-wrap:balance; }
.respuesta mark { background:linear-gradient(transparent 58%, var(--tema-suave) 58%); color:inherit; }
.historia { font-size:1.02rem; line-height:1.55; color:var(--ink-2); margin:0; }
.historia p { margin:0 0 .9em; } .historia p:last-child { margin:0; } .historia a { color:var(--ink); font-weight:700; text-decoration-color:var(--tema); text-decoration-thickness:2px; text-underline-offset:3px; }
.cita { font-family:var(--f-display); font-weight:700; font-size:clamp(1.3rem, 5.6vw, 1.8rem); line-height:1.15; letter-spacing:-.01em; margin:0; }
.cita::before { content:"\201C"; color:var(--tema); } .cita::after { content:"\201D"; color:var(--tema); }
.origen { font-family:var(--f-mono); font-size:.7rem; letter-spacing:.03em; color:var(--ink-2); line-height:1.5; margin:0; }
.cifra-grande { font-family:var(--f-display); font-weight:800; font-size:clamp(3rem, 14vw, 4.4rem); line-height:.9; letter-spacing:-.03em; color:var(--tema); margin:0; }
.leyenda { font-size:.98rem; line-height:1.45; margin:0; font-weight:700; }
.grafico { width:100%; height:auto; display:block; } svg text { font-family:var(--f-body); }
.recuerda { background:var(--tema); color:var(--tema-tinta); padding:16px 18px; border-radius:6px; font-family:var(--f-display); font-weight:700; font-size:1.2rem; line-height:1.2; margin:0; }
.recuerda small { display:block; font-family:var(--f-mono); font-weight:500; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; opacity:.85; margin-bottom:6px; }
.fuente { font-size:.88rem; color:var(--ink-2); line-height:1.6; border-top:1px solid var(--rule); padding-top:10px; }
.fuente a { color:var(--ink); font-weight:700; text-decoration-color:var(--tema); text-decoration-thickness:2px; text-underline-offset:3px; }
.abajo { padding:10px 18px calc(14px + env(safe-area-inset-bottom, 0px)); display:flex; justify-content:space-between; align-items:center; gap:8px; z-index:2; }
.boton { font:inherit; font-weight:700; font-size:.95rem; color:inherit; background:transparent; border:1.5px solid currentColor; border-radius:999px; padding:9px 16px; cursor:pointer; text-decoration:none; }
.boton.principal { margin-left:auto; background:var(--ink); color:var(--paper); border-color:var(--ink); }
.reel.portada .boton.principal { background:var(--tema-tinta); color:var(--tema); border-color:var(--tema-tinta); }
.boton.chico { font-size:.8rem; padding:6px 11px; }
.puntos { display:flex; gap:6px; align-items:center; }
.puntos i { width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.22; } .puntos i.hecho { opacity:1; }
/* library and course pages */
.titulo { font-family:var(--f-display); font-weight:800; font-size:clamp(2rem, 9vw, 2.9rem); line-height:.98; letter-spacing:-.02em; margin:0; }
.titulo b { color:var(--tema); }
.sub { font-size:1rem; line-height:1.5; color:var(--ink-2); margin:0; }
.lista { list-style:none; padding:0; margin:0; display:grid; }
.lista button, .lista .fila { all:unset; box-sizing:border-box; width:100%; display:grid; grid-template-columns:8px 1fr auto; gap:12px; align-items:start; padding:12px 2px; border-bottom:1px solid var(--rule); cursor:pointer; }
.lista .barra { width:8px; align-self:stretch; border-radius:2px; background:var(--tema); }
.lista .q { font-family:var(--f-display); font-weight:700; font-size:1.08rem; line-height:1.15; }
.lista .t { font-family:var(--f-mono); font-size:.66rem; color:var(--ink-2); letter-spacing:.06em; text-transform:uppercase; margin-top:4px; }
.lista .estado { font-family:var(--f-mono); font-size:.68rem; color:var(--ink-2); white-space:nowrap; text-align:right; }
.lista .bloqueado { opacity:.45; cursor:default; }
.lista .listo .q { color:var(--ink-2); } .lista .listo .barra { background:var(--ink); }
.acciones { display:flex; gap:8px; flex-wrap:wrap; }
.nota { font-size:.82rem; color:var(--ink-2); line-height:1.45; margin:0; }
label.campo { display:block; font-family:var(--f-mono); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); margin:4px 0 4px; }
input, textarea { width:100%; box-sizing:border-box; border:1.5px solid var(--rule); border-radius:10px; padding:10px 12px; font:inherit; font-size:.95rem; color:var(--ink); background:#fff; }
textarea { min-height:110px; resize:vertical; font-family:var(--f-mono); font-size:.78rem; }
.chips { display:flex; gap:6px; flex-wrap:wrap; } .chips button { font:inherit; font-size:.78rem; font-weight:700; border:1.5px solid var(--rule); background:var(--wash); border-radius:999px; padding:6px 11px; cursor:pointer; color:var(--ink); }
.paso { display:grid; gap:8px; } .paso h3 { font-family:var(--f-display); font-weight:800; font-size:1.25rem; margin:0; letter-spacing:-.01em; } .paso h3 span { color:var(--tema); margin-right:6px; }
.error { background:#fff1f0; border:1.5px solid #ffb4ad; border-radius:10px; padding:10px 12px; font-size:.88rem; line-height:1.45; color:#7a1f17; }
.error button { margin-top:6px; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:.85rem; font-weight:700; opacity:0; transition:opacity .3s; pointer-events:none; z-index:9; max-width:88vw; text-align:center; }
.toast.show { opacity:1; }
details summary { cursor:pointer; font-family:var(--f-mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); }
details .acciones { margin-top:8px; }
@media (max-height:740px) { .arriba { padding-top:10px; gap:6px; } .lamina { padding:10px 20px; gap:11px; } .pregunta { font-size:clamp(1.5rem, 6.6vw, 2.1rem); } .opcion { padding:9px 12px; font-size:.93rem; } .historia { font-size:.95rem; line-height:1.45; } .recuerda { font-size:1.05rem; padding:12px 14px; } }
@media (prefers-reduced-motion: reduce) { .lamina { animation:none; } .reel { transition:none; } }
</style>
</head>
<body>
<div class="escena"><div class="reel" id="reel">
  <div class="arriba"><div class="avance"><i id="bar" style="width:0%"></i></div><div class="meta"><div class="marca" id="marca">Five Mornings</div><div class="num" id="num"></div></div></div>
  <div class="lamina" id="lamina"></div>
  <div class="abajo" id="abajo"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const BUILTIN = ['wdr', 'evidence'];
let courses = {}, cur = null, curDay = null, page = 0, view = 'lib';
const LS = { get(k, d){ try { const v = localStorage.getItem('fm-'+k); return v==null? d : JSON.parse(v); } catch(e){ return d; } }, set(k,v){ try { localStorage.setItem('fm-'+k, JSON.stringify(v)); } catch(e){} }, del(k){ try { localStorage.removeItem('fm-'+k); } catch(e){} } };
let tt; function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function dayKey(d){ d = d || new Date(); return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(); }
function keyToDate(k){ return new Date(Math.floor(k/10000), Math.floor(k/100)%100-1, k%100); }
function daysBetween(a, b){ return Math.round((keyToDate(b)-keyToDate(a))/86400000); }
function nextWeekday(d){ d = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1); while (d.getDay()===0 || d.getDay()===6) d.setDate(d.getDate()+1); return d; }
function fmtDate(d){ return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'short'}); }
function pageUrl(){ return location.href.split('#')[0]; }
function setTema(color){ const r = $('reel'); const c = color || '#2f4bff'; r.style.setProperty('--tema', c); r.style.setProperty('--tema-suave', c + '33'); }

async function loadBuiltin(){
  for (const id of BUILTIN){ try { const r = await fetch('courses/'+id+'.json', {cache:'no-cache'}); if (r.ok){ const c = await r.json(); c._builtin = true; courses[c.id] = c; } } catch(e){} }
  const mine = LS.get('courses', {}); for (const id in mine) courses[id] = mine[id];
}
function state(id){ return LS.get('st-'+id, {start:null, done:{}, unlocked:false}); }
function saveState(id, s){ LS.set('st-'+id, s); }
function paint(opts){
  const r = $('reel'); r.classList.toggle('portada', !!opts.portada);
  $('bar').style.width = (opts.progress||0) + '%';
  $('marca').textContent = opts.marca || 'Five Mornings'; $('num').textContent = opts.num || '';
  const l = $('lamina'); l.className = 'lamina' + (opts.top ? ' arriba-alineada' : ''); l.innerHTML = opts.html; l.onclick = opts.onTap || null;
  $('abajo').innerHTML = opts.abajo || '';
  l.scrollTop = 0;
}

/* LIBRARY */
function go(v){ view = v; if (v==='lib') renderLib(); if (v==='make') renderMake(); }
function renderLib(){
  setTema('#0d0d12'); history.replaceState(null,'',location.pathname);
  const ids = Object.keys(courses);
  let items = ids.map(id => { const c = courses[id], s = state(id), done = Object.keys(s.done).length, n = c.days.length;
    return `<li><button onclick="openCourse('${id}')"><span class="barra" style="background:${esc(c.color||'#2f4bff')}"></span><span><span class="q">${esc(c.title)}</span><span class="t" style="display:block">${n} mornings${c._builtin?'':' · made by you'}</span></span><span class="estado">${done ? done+'/'+n : (s.start ? 'started' : 'new')}</span></button></li>`; }).join('');
  if (!ids.length) items = '<li class="nota">No courses yet. Make one from a document below.</li>';
  paint({ top:true, progress:0, marca:'Five Mornings', num:'AI Tuesday',
    html: `<h1 class="titulo">Any long report, <b>three minutes</b> a morning.</h1><p class="sub">One question first, then a short lesson, a quote with its page, and one thing to do. Five mornings and you have read it.</p><ul class="lista">${items}</ul><div class="acciones"><button class="boton" onclick="go('make')">Make one from my document</button><label class="boton chico" style="display:inline-block">Load a course file<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this)"></label></div><p class="nota">Progress stays on this device. On the phone, Add to Home Screen puts the icon next to the ones you use.</p>`,
    abajo: `<span class="nota">Made for the <a href="https://ezequielmolina-lang.github.io/ai-tuesday-toolbox/" style="color:inherit;font-weight:700">AI Tuesday Toolbox</a></span>` });
}

/* COURSE OVERVIEW */
function dayStatus(s, i){ if (s.done[i]) return 'done'; if (s.unlocked || i===0) return 'open'; if (!s.done[i-1]) return 'locked'; return daysBetween(s.done[i-1], dayKey()) >= 1 ? 'open' : 'locked'; }
function lockText(s, i){ if (!s.done[i-1]) return 'after ' + i; return fmtDate(nextWeekday(keyToDate(s.done[i-1]))).split(' ')[0]; }
function openCourse(id){
  cur = courses[id]; if (!cur) return go('lib'); view = 'course'; setTema(cur.color); const s = state(id);
  const allDone = cur.days.every((d,i) => s.done[i]);
  const rows = cur.days.map((d,i) => { const st = dayStatus(s,i); const cls = st==='locked' ? 'bloqueado' : st==='done' ? 'listo' : '';
    return `<li><button class="${cls}" ${st==='locked' ? '' : `onclick="openDay(${i})"`}><span class="barra"></span><span><span class="q">${esc(d.title)}</span><span class="t" style="display:block">Morning ${d.n}</span></span><span class="estado">${st==='done' ? 'done' : st==='locked' ? '&#128274; ' + lockText(s,i) : 'open'}</span></button></li>`; }).join('');
  const src = cur.source && cur.source.name ? `<p class="nota">Source: ${cur.source.url ? `<a href="${esc(cur.source.url)}" target="_blank" rel="noopener" style="color:inherit;font-weight:700">${esc(cur.source.name)}</a>` : esc(cur.source.name)}${cur.source.pages ? ' (' + cur.source.pages + ' pages)' : ''}. ${esc(cur.made_with||'')}</p>` : `<p class="nota">${esc(cur.made_with||'')}</p>`;
  const finish = allDone ? `<p class="recuerda"><small>Five mornings</small>You have read it. Send the course to your team.</p>` : '';
  paint({ top:true, progress: Math.round(100*Object.keys(s.done).length/cur.days.length), marca: cur.title, num: `${cur.days.length} mornings`,
    html: `${finish}<h1 class="titulo">${esc(cur.title)}</h1><p class="sub">${esc(cur.subtitle||'')}</p><ul class="lista">${rows}</ul>${src}<div class="acciones"><button class="boton chico" onclick="exportCourse()">Download to share</button><button class="boton chico" onclick="unlockAll()">I am impatient</button></div><details><summary>More</summary><div class="acciones"><button class="boton chico" onclick="resetCourse()">Start over</button>${cur._builtin ? '' : '<button class="boton chico" onclick="deleteCourse()">Remove from this device</button>'}</div></details>`,
    abajo: `<button class="boton" onclick="go('lib')">&larr; Courses</button>` });
  history.replaceState(null,'','#c=' + id);
}

/* DAY REEL */
function pagesFor(d){
  const q = d.question && d.question.q && Array.isArray(d.question.options) && d.question.options.length ? d.question : null;
  const paras = (d.lesson.match(/<p[\s\S]*?<\/p>/gi) || [d.lesson]);
  const half = Math.ceil(paras.length/2);
  const P = [];
  if (q) P.push({k:'q'}); P.push({k:'a'});
  if (hasFig(d)) P.push({k:'fig'});
  P.push({k:'l', html: paras.slice(0, half).join('')}); if (paras.length > half) P.push({k:'l', html: paras.slice(half).join('')});
  if (d.quote && d.quote.text) P.push({k:'quote'});
  P.push({k:'do'});
  return P;
}
function openDay(i){
  const s = state(cur.id); if (!s.start){ s.start = dayKey(); saveState(cur.id, s); }
  curDay = i; page = 0; view = 'day'; renderPage();
}
function renderPage(){
  const d = cur.days[curDay], s = state(cur.id), P = pagesFor(d), p = P[page], n = P.length;
  const q = d.question; const answered = s.answers && s.answers[curDay];
  const dots = `<span class="puntos">${P.map((x,k)=>`<i class="${k<=page?'hecho':''}"></i>`).join('')}</span>`;
  const nav = (extra='') => `<button class="boton chico" onclick="${page===0 ? `openCourse('${cur.id}')` : 'prev()'}">&larr;</button>${dots}${extra}<button class="boton principal" onclick="next()">${page===n-1 ? 'Done' : 'Next'}</button>`;
  const common = { progress: Math.round(100*(page+1)/n), marca: cur.title, num: `Morning ${d.n} of ${cur.days.length}` };
  if (p.k==='q'){
    const opts = q.options.map((t,k) => `<button class="opcion${answered ? (k===q.answer?' bien':(k===answered.pick?' mal':'')) : ''}" ${answered?'disabled':''} onclick="event.stopPropagation(); answer(${k})">${String.fromCharCode(65+k)}. ${esc(t)}</button>`).join('');
    paint(Object.assign(common, { portada:true, html:`<span class="tema">Guess first</span><h2 class="pregunta">${esc(q.q)}</h2><div class="opciones">${opts}</div><div class="pista">${answered ? 'Tap next to read why' : 'Wrong is fine. Wrong is how it sticks.'}</div>`, abajo: nav() }));
  } else if (p.k==='a'){
    const ans = q ? `<p class="etiqueta">The answer</p><h2 class="respuesta"><mark>${esc(q.options[q.answer])}</mark></h2><p class="historia">${esc(q.explain||'')}</p>` : `<p class="etiqueta">Morning ${d.n}</p><h2 class="respuesta">${esc(d.title)}</h2>`;
    paint(Object.assign(common, { html:`${ans}<p class="nota">${esc(d.hook||'')}</p>`, abajo: nav(), onTap: tapNext }));
  } else if (p.k==='fig'){
    // "The number": the same page EvidencIA Papers gives every study. The chart is drawn from the figures in the JSON, so a number that is not in the file cannot appear here.
    const f = d.figure;
    paint(Object.assign(common, { html:`<p class="etiqueta">The number</p>${f.big ? `<p class="cifra-grande">${esc(f.big)}</p>` : ''}${barras(f)}<p class="leyenda">${esc(f.caption||'')}</p>${f.where ? `<p class="origen">${esc(f.where)}</p>` : ''}${f.note ? `<p class="nota">${esc(f.note)}</p>` : ''}`, abajo: nav(), onTap: tapNext }));
  } else if (p.k==='l'){
    paint(Object.assign(common, { html:`<p class="etiqueta">${esc(d.title)}</p><div class="historia">${p.html}</div>`, abajo: nav(), onTap: tapNext }));
  } else if (p.k==='quote'){
    paint(Object.assign(common, { html:`<p class="etiqueta">In the document, verbatim</p><p class="cita">${esc(d.quote.text)}</p><p class="origen">${esc(d.quote.where||'')}</p><p class="nota">Open the page and read the sentence. If it is not there, the AI invented it, and you learned something about both.</p>`, abajo: nav(), onTap: tapNext }));
  } else if (p.k==='do'){
    const src = cur.source && cur.source.url ? `<a href="${esc(cur.source.url)}" target="_blank" rel="noopener">Keep reading: ${esc(cur.source.name)}</a>` : (cur.source && cur.source.name ? esc(cur.source.name) : '');
    const next = curDay < cur.days.length-1 ? `Morning ${d.n+1} opens ${fmtDate(nextWeekday(new Date()))}.` : 'Last morning. You have read it.';
    paint(Object.assign(common, { html:`<p class="recuerda"><small>Do this today, two minutes</small>${esc(d.do||'')}</p><p class="nota">${next}</p><div class="acciones"><button class="boton chico" onclick="shareDay()">Copy the question for the chat</button>${curDay < cur.days.length-1 ? '<button class="boton chico" onclick="downloadIcs()">Add the next mornings to my calendar</button>' : ''}</div><p class="fuente">${src}</p>`, abajo: nav() }));
  }
}
function tapNext(e){ if (e.target.closest('a,button,input,textarea')) return; next(); }
function hasFig(d){ return !!(d.figure && Array.isArray(d.figure.bars) && d.figure.bars.length >= 2); }
function barras(f){
  // Same bar chart as EvidencIA Papers: up to four bars, the course color first, values printed on top, labels cut to two short lines.
  const bs = f.bars.slice(0,4), maxV = Math.max(...bs.map(b => Math.abs(b.value)), 1e-9);
  const neg = bs.some(b => b.value < 0);
  const W = 320, H = 210, w = (W - 20) / bs.length, top = 30, bottom = H - 46;
  const cero = neg ? (top + bottom) / 2 : bottom, alto = neg ? (bottom - top) / 2 : bottom - top;
  const pre = f.prefix || '', suf = f.suffix || '';
  const valor = v => (v < 0 ? '−' : (neg && v > 0 ? '+' : '')) + pre + String(Math.abs(v)) + suf;
  const lim = Math.max(10, Math.floor(w / 6.4));
  const corte = (s, k) => { const out = ['', '']; let j = 0; for (const p of String(s).split(' ')){ if ((out[j] + ' ' + p).trim().length > lim && j === 0 && out[0]) j = 1; out[j] = (out[j] + ' ' + p).trim(); } return out[k].slice(0, lim + 4); };
  const tema = (cur && cur.color) || '#2f4bff';
  const tonos = [tema, '#0d0d12', '#9a9aa6', '#c9c9d2'];
  const aria = bs.map(b => b.label + ' ' + valor(b.value)).join(', ');
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
    ${bs.map((b, k) => { const h = (Math.abs(b.value) / maxV) * alto; const cx = 10 + k * w + w / 2; const y = b.value >= 0 ? cero - h : cero; const ty = b.value >= 0 ? cero - h - 9 : cero + h + 20; return `
      <rect x="${cx - w * 0.32}" y="${y}" width="${w * 0.64}" height="${Math.max(h, 2)}" fill="${tonos[k % 4]}"/>
      <text x="${cx}" y="${ty}" text-anchor="middle" font-size="17" font-weight="700" fill="#0d0d12">${esc(valor(b.value))}</text>
      <text x="${cx}" y="${H - 24}" text-anchor="middle" font-size="11.5" fill="#4a4a55">${esc(corte(b.label, 0))}</text>
      <text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="11.5" fill="#4a4a55">${esc(corte(b.label, 1))}</text>`; }).join('')}
    <line x1="4" y1="${cero}" x2="${W - 4}" y2="${cero}" stroke="#0d0d12" stroke-width="1.5"/>
  </svg>${f.unit ? `<p class="nota">${esc(f.unit)}</p>` : ''}`;
}
function prev(){ if (page>0){ page--; renderPage(); } }
function next(){
  const P = pagesFor(cur.days[curDay]);
  if (page < P.length-1){ page++; renderPage(); return; }
  const s = state(cur.id); if (!s.done[curDay]){ s.done[curDay] = dayKey(); saveState(cur.id, s); }
  const n = Object.keys(state(cur.id).done).length; toast(n===cur.days.length ? 'Five mornings. You have read it.' : 'Saved. See you tomorrow.');
  openCourse(cur.id);
}
function answer(k){
  const s = state(cur.id); s.answers = s.answers||{}; s.answers[curDay] = {pick:k, right:(k===cur.days[curDay].question.answer)};
  if (!s.done[curDay]) s.done[curDay] = dayKey();
  saveState(cur.id, s); renderPage();
}
function unlockAll(){ const s = state(cur.id); s.unlocked = true; saveState(cur.id, s); toast('All mornings open. We will not tell.'); openCourse(cur.id); }
function resetCourse(){ if (!confirm('Start this course over?')) return; LS.del('st-'+cur.id); openCourse(cur.id); }
function deleteCourse(){ if (!confirm('Remove this course from this device?')) return; const mine = LS.get('courses', {}); delete mine[cur.id]; LS.set('courses', mine); delete courses[cur.id]; LS.del('st-'+cur.id); go('lib'); }
function fileName(){ return 'Five-Mornings_' + (cur.title||'course').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50) + '.json'; }
function exportCourse(){ const c = Object.assign({}, cur); delete c._builtin; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(c, null, 2)], {type:'application/json'})); a.download = fileName(); a.click(); toast(cur._builtin ? 'File downloaded.' : 'File downloaded. Send it; they load it on this page.'); }
function shareDay(){
  const d = cur.days[curDay]; const q = d.question;
  const opts = q && q.options ? q.options.map((t,k)=>String.fromCharCode(65+k)+'. '+t).join('\n') : '';
  const where = cur._builtin ? `${pageUrl()}#c=${cur.id}` : `the course file I sent, loaded at ${pageUrl()}`;
  const line = q ? `Guess first (from "${cur.title}", morning ${d.n}): ${q.q}\n${opts}\nAnswer in morning ${d.n}: ${where}` : `Morning ${d.n} of "${cur.title}": ${d.title}. ${where}`;
  navigator.clipboard.writeText(line).then(()=>toast('Question copied for the chat.'));
}
function downloadIcs(){
  let d = new Date(); const ev = [];
  for (let i = curDay+1; i < cur.days.length; i++){ d = nextWeekday(d); const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    ev.push(`BEGIN:VEVENT\r\nUID:fm-${cur.id}-${i}@ai-tuesday\r\nDTSTAMP:${ymd}T080000\r\nDTSTART:${ymd}T080000\r\nDTEND:${ymd}T080500\r\nSUMMARY:Morning ${i+1}: ${(cur.days[i].title||'').replace(/[,;\\]/g,' ')}\r\nDESCRIPTION:Three minutes. ${pageUrl()}#c=${cur.id}\r\nURL:${pageUrl()}#c=${cur.id}\r\nEND:VEVENT`); }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//AI Tuesday//Five Mornings//EN\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR\r\n`], {type:'text/calendar'})); a.download = 'Five-Mornings.ics'; a.click(); toast('Calendar file downloaded. Open it and Outlook adds the mornings.');
}

/* MAKE */
const SCHEMA = `{"id":"short-slug","title":"Course title","subtitle":"one witty line","emoji":"one emoji","color":"#hex","source":{"name":"document title","url":"link or empty","pages":0},"made_with":"one line on how it was made","audience":"who it is for","days":[{"n":1,"title":"max 7 words","hook":"one sentence on why this morning matters","lesson":"plain text, 3 or 4 paragraphs separated by blank lines, 230 to 290 words, teaches the actual content","quote":{"text":"verbatim sentence from the document, 15 to 45 words","where":"section and page number"},"figure":{"bars":[{"label":"short label","value":12.3},{"label":"short label","value":4.5}],"prefix":"","suffix":"%","big":"optional headline number as text, or empty","caption":"one line saying what the bars measure","where":"table or figure name and page number","note":"one line of context, or empty"},"question":{"q":"one guess-first question","options":["...","...","...","..."],"answer":"A","explain":"2 or 3 sentences with the page reference"},"do":"one 2-minute action on the reader's own work"}]}`;
function makePrompt(){
  const doc = (LS.get('mDoc','')||'').trim() || 'the attached document'; const who = (LS.get('mWho','')||'').trim() || 'a busy colleague who should know this document but has never read it fully';
  return `Read the attached document in full: ${doc}. If no document is attached and you cannot open it, say so and stop; never write it from memory. Turn it into a five-day micro-course for ${who}. One lesson per day, about three minutes to read, that teaches the ACTUAL content (what it says, the numbers, the examples, the exceptions), not generalities. Rules: every quote must be verbatim from the document with the PDF page number I can check (count from the cover of the file, not the printed folio); every claim must come from the document, no outside knowledge; plain English, one dry line of humor per day at most; no dashes as punctuation; lessons are plain text with no markdown or HTML. Each day has a "figure": 2 to 4 numbers from the document that sit on the same scale (shares, amounts, years, scores), copied exactly, with the page where I can check them; if a day's content has no such numbers, set "figure" to null rather than inventing or mixing scales. Answer in this chat as text, not as a file. Return ONLY valid JSON (no markdown fences, no commentary before or after) in exactly this schema, with exactly 5 items in "days", exactly 4 options per question, and "answer" as the letter of the correct option:\n${SCHEMA}`;
}
function renderMake(){
  setTema('#0d0d12'); history.replaceState(null,'','#make');
  paint({ top:true, progress:0, marca:'Make one', num:'two steps',
    html: `<h1 class="titulo">Your document, <b>five mornings</b>.</h1><p class="sub">The report you saved for the flight, the evaluation everyone quotes, the strategy you were cc'd on. Make it on your laptop, take it on your phone.</p>
    <div class="paso"><h3><span>1</span>Give the prompt and the file to your AI</h3><p class="nota"><b>Internal document</b> (anything from WBDocs, a draft): <b>Copilot</b>, Cowork or Chat, with the file attached as a PDF so the page numbers mean something. If you have to ask whether a document is public, it is not.<br><b>Public document</b>: Copilot, ChatGPT or Claude. Attach the PDF; a link alone is often not read in full.</p>
    <p class="nota"><b>First time?</b> Try a public PDF:</p><div class="chips"><button onclick="tryDoc('World Development Report 2026 overview, https://openknowledge.worldbank.org/bitstreams/00cfb233-585b-41fd-b2cb-d7f6dd5ef6d9/download','a colleague who wants the argument and the numbers of the WDR')">WDR 2026 overview</button><button onclick="tryDoc('World Bank Procurement Regulations for IPF Borrowers, https://thedocs.worldbank.org/en/doc/178331533065871195-0290022020/original/ProcurementRegulations.pdf','a task team member who applies the Procurement Regulations and has only read the summary')">Procurement Regulations</button><button onclick="tryDoc('World Bank Environmental and Social Framework, https://thedocs.worldbank.org/en/doc/837721522762050108-0290022018/original/ESFFramework.pdf','a new team member who needs to find any ESS requirement in under a minute')">The ESF</button></div>
    <label class="campo">Document name, and link if public (optional)</label><input id="mDoc" placeholder="e.g. Country Partnership Framework 2026" value="${esc(LS.get('mDoc',''))}" oninput="LS.set('mDoc', this.value)">
    <label class="campo">Who is it for, what should they manage after day 5 (optional)</label><input id="mWho" placeholder="e.g. new team members; find any covenant in a minute" value="${esc(LS.get('mWho',''))}" oninput="LS.set('mWho', this.value)">
    <div class="acciones"><button class="boton" onclick="copyPrompt()">Copy the prompt</button><a class="boton chico" target="_blank" rel="noopener" href="#" onclick="this.href='https://chatgpt.com/?q='+encodeURIComponent(makePrompt()); toast('Attach the PDF before you send.')">Open in ChatGPT</a><a class="boton chico" target="_blank" rel="noopener" href="#" onclick="this.href='https://claude.ai/new?q='+encodeURIComponent(makePrompt()); toast('Attach the PDF before you send.')">Open in Claude</a></div>
    <p class="nota">Copilot has no link that opens with a question: copy, open Copilot, attach, paste.</p></div>
    <div class="paso"><h3><span>2</span>Paste what the AI returned</h3><p class="nota">A block of text that starts with a curly bracket. You are allowed not to read it.</p><textarea id="mJson" placeholder='{"id": "...", "title": "...", "days": [ ... ] }'></textarea><div class="acciones"><button class="boton principal" style="margin:0" onclick="importJson()">Build my course</button><label class="boton chico" style="display:inline-block">Load a file<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this)"></label></div><div class="error" id="mErr" hidden></div></div>
    <p class="nota"><b>Check before you trust.</b> Open the document at the page a lesson cites and read the sentence. A wrong page is a finding, not a failure.</p>`,
    abajo: `<button class="boton" onclick="go('lib')">&larr; Courses</button>` });
}
function tryDoc(doc, who){ LS.set('mDoc', doc); LS.set('mWho', who); $('mDoc').value = doc; $('mWho').value = who; toast('Filled in. Copy the prompt, open the PDF link, attach it.'); }
function copyPrompt(){ navigator.clipboard.writeText(makePrompt()).then(()=>toast('Prompt copied. Attach the document and paste.')); }
function showErr(msg, copyText){ const e = $('mErr'); e.hidden = false; e.innerHTML = msg + (copyText ? `<br><button class="boton chico" onclick="navigator.clipboard.writeText(${JSON.stringify(copyText).replace(/"/g,'&quot;')}).then(()=>toast('Copied. Paste it to the AI.'))">Copy that message</button>` : ''); }
function sanitize(html){ const t = document.createElement('div'); t.innerHTML = html; t.querySelectorAll('script,style,iframe,object,embed,img,form,input').forEach(n => n.remove()); t.querySelectorAll('*').forEach(n => { [...n.attributes].forEach(a => { if (/^on/i.test(a.name) || (a.name==='href' && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name); }); }); return t.innerHTML; }
function toParas(text){ if (/<p[\s>]/i.test(text)) return sanitize(text); const parts = String(text).split(/\n\s*\n|\n/).map(s => s.trim()).filter(Boolean); return parts.map(s => '<p>' + sanitize(s) + '</p>').join(''); }
function normAnswer(a, n){ if (typeof a === 'number') return a; const s = String(a).trim().toUpperCase(); if (/^[A-D]$/.test(s)) return s.charCodeAt(0)-65; if (/^\d+$/.test(s)){ const k = parseInt(s,10); return k >= n ? k-1 : k; } return -1; }
function repairNewlines(s){ let o='', inStr=false, escp=false; for (const ch of s){ if (inStr){ if (escp){ o+=ch; escp=false; } else if (ch==='\\'){ o+=ch; escp=true; } else if (ch==='"'){ o+=ch; inStr=false; } else if (ch==='\n'){ o+='\\n'; } else if (ch==='\r'){ } else if (ch==='\t'){ o+='\\t'; } else o+=ch; } else { o+=ch; if (ch==='"') inStr=true; } } return o; }
function validate(c){
  if (!c || typeof c !== 'object') return 'Not a course.';
  if (!c.title || !Array.isArray(c.days) || !c.days.length) return 'Missing a title or the list of days.';
  const warns = [];
  c.days.forEach((d, i) => {
    if (!d.title || !d.lesson) throw new Error('Morning ' + (i+1) + ' has no title or no lesson. Ask the AI to resend that morning.');
    d.lesson = toParas(d.lesson); d.hook = d.hook||''; d.do = d.do||''; d.n = i+1;
    const f = d.figure;
    if (f && typeof f === 'object' && Array.isArray(f.bars)){
      f.bars = f.bars.slice(0,4).map(b => ({label:String(b && b.label != null ? b.label : ''), value:Number(b && b.value)})).filter(b => isFinite(b.value));
      ['prefix','suffix','big','caption','where','note','unit'].forEach(k => { f[k] = f[k] == null ? '' : String(f[k]); });
      if (f.bars.length < 2){ d.figure = null; warns.push(`Morning ${i+1}: the figure had fewer than two numbers, so it is hidden.`); }
    } else d.figure = null;
    const words = d.lesson.replace(/<[^>]+>/g,' ').split(/\s+/).filter(Boolean).length; if (words > 450) warns.push(`Morning ${i+1} is ${words} words; three minutes is the design.`);
    if (d.question && d.question.q && Array.isArray(d.question.options)){ d.question.options = d.question.options.slice(0,4).map(String); d.question.answer = normAnswer(d.question.answer, d.question.options.length);
      if (d.question.answer < 0 || d.question.answer >= d.question.options.length){ warns.push(`Morning ${i+1}: the answer did not match an option, so the question is hidden.`); d.question = null; } }
    else { d.question = null; warns.push(`Morning ${i+1} has no question; it will show without one.`); }
  });
  if (c.days.length !== 5) warns.push(`This course has ${c.days.length} mornings, not five. Built anyway.`);
  c.id = (c.id || c.title).toString().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'course';
  if (courses[c.id] && courses[c.id]._builtin) c.id += '-mine';
  return warns.length ? {warns} : null;
}
function importJson(){
  let txt = $('mJson').value.trim(); $('mErr').hidden = true;
  const a = txt.indexOf('{'); if (a < 0){ showErr('That does not look like the AI\'s answer: there is no { in it. Ask the AI to return the course as JSON in this chat, then paste everything it sends.'); return; }
  const opens = (txt.match(/{/g)||[]).length, closes = (txt.match(/}/g)||[]).length, b = txt.lastIndexOf('}');
  let c = null;
  try { c = JSON.parse(txt.slice(a, b+1)); } catch(e0){ try { c = JSON.parse(repairNewlines(txt.slice(a, b+1))); } catch(e){
    if (opens > closes){ const m = txt.match(/"n"\s*:\s*(\d+)/g); const last = m ? parseInt(m[m.length-1].replace(/\D/g,''),10) : 1;
      showErr(`The answer was cut off before the end (around morning ${last}). Send the AI this message and paste the full result again:`, `The JSON was cut off. Please resend the complete course as one JSON block, all ${Math.max(5,last)} mornings, shorter lessons (about 200 words each) so it fits, no commentary.`); return; }
    showErr('That is not valid JSON, usually a stray quote mark inside a lesson. Send the AI this message and paste again:', 'The JSON did not parse. Please resend the whole course as one valid JSON block, lessons as plain text with no quotation marks inside them, no markdown fences, no commentary.'); return; } }
  let res; try { res = validate(c); } catch(e){ showErr(e.message); return; }
  if (res && typeof res === 'string'){ showErr(res); return; }
  const mine = LS.get('courses', {}); mine[c.id] = c; LS.set('courses', mine); courses[c.id] = c;
  toast(res && res.warns ? res.warns[0] : 'Course built. Morning 1 is open.'); cur = courses[c.id]; if (res) openCourse(c.id); else { openCourse(c.id); openDay(0); }
}
function importFile(inp){ const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { if (view !== 'make') renderMake(); $('mJson').value = r.result; importJson(); }; r.readAsText(f); inp.value=''; }

(async () => {
  await loadBuiltin();
  const h = location.hash.replace('#','');
  if (h === 'make') go('make');
  else if (h.startsWith('c=')){ const q = new URLSearchParams(h); const id = q.get('c'); if (!courses[id]) return go('lib'); cur = courses[id];
    if (q.get('d')){ openCourse(id); openDay(Math.max(0, Math.min(cur.days.length-1, parseInt(q.get('d'),10)-1))); page = Math.max(0, parseInt(q.get('p')||'0',10)); renderPage(); }
    else if (!state(id).start){ openCourse(id); openDay(0); } else openCourse(id); }
  else go('lib');
})();
</script>
